# Nginx del servidor: un solo Nginx para todos los clientes.
# Cada cliente tiene su archivo en /etc/nginx/sitios/<cliente>.conf (hecho desde
# despliegue/web/sitio.conf.plantilla). Una dirección que no es de ningún cliente no recibe nada.

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Sin la versión de Nginx en las respuestas ni en las páginas de error.
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Lo más que puede pesar una petición. Una ruta de subida de archivos lo sube solo para ella.
  client_max_body_size 1m;

  # Cada línea con el número de la petición, el mismo que recibe la API (x-request-id).
  log_format principal '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                       '$request_time "$http_user_agent" $request_id';
  access_log /dev/stdout principal;

  # Compresión de lo que es texto (las fuentes woff2 y las imágenes ya vienen comprimidas).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             application/manifest+json image/svg+xml;

  # El DNS de Docker: así Nginx encuentra la API de cada cliente por su nombre aunque se haya
  # reiniciado (y arranca aunque la de un cliente esté apagada).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HTTPS: solo versiones seguras.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Dirección desconocida por HTTP: solo responde a Let's Encrypt (para sacar el certificado de
  # un cliente nuevo antes de que tenga su sitio); lo demás se corta sin respuesta.
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/acme;
    }

    location / {
      return 444;
    }
  }

  # Dirección desconocida por HTTPS: se corta sin mostrar ningún certificado.
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  include /etc/nginx/sitios/*.conf;
}
