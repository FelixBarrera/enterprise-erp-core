# Cabeceras de seguridad de las pantallas (docs/arquitectura-backend.md, sección 17).
# En Nginx, un `add_header` dentro de un `location` borra los de afuera: por eso cada `location`
# de aplicacion.conf incluye este archivo. La API pone las suyas (helmet).
#
# Content-Security-Policy, lo que el navegador deja cargar:
# - Scripts solo del mismo sitio. La única excepción es el `onload="this.media='all'"` que Angular
#   pone en la hoja de estilos (carga de estilos sin bloquear): se permite ese texto exacto, por su
#   huella (sha256). Si Angular la cambia, la consola del navegador lo dice y se calcula la nueva:
#     printf "%s" "this.media='all'" | openssl dgst -sha256 -binary | base64
# - Estilos del mismo sitio y en línea: Angular y Material ponen estilos en la página.
# - Imágenes del sitio y `data:` (los íconos dibujados dentro del CSS de Material).
# - Sin marcos (nadie puede meter el sistema dentro de otra página), sin formularios a otro sitio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
# Un año solo por HTTPS (el navegador no vuelve a intentar por HTTP).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
