# Lo común del sitio de un cliente: las pantallas y el paso de /api a su copia de la API.
# Lo incluye cada sitio (sitio.conf.plantilla) después de fijar `$api`.

root /usr/share/nginx/aplicacion;

# ─── La API del cliente ───
# `$api` (en una variable): Nginx la busca al momento, así arranca aunque esa copia esté apagada
# (responde 502 y el frontend dice que el servidor no está disponible).
location /api/ {
  proxy_pass $api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # La IP real del usuario. Se reemplaza (no se suma) lo que mande el navegador: con
  # TRUST_PROXY=true la API cree a esta cabecera, así que nadie debe poder inventarla.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # El mismo número de petición en el log de Nginx y en el de la API.
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}

# Cache-Control sin `always`: solo en las respuestas buenas (un 404 no se guarda).
# ─── Archivos con huella en el nombre (main-AB12CD34.js): no cambian nunca ───
# (Entre comillas: Nginx no acepta las llaves de {8} sin ellas.)
location ~* "-[A-Z0-9]{8}\.(js|css|woff2)$" {
  include /etc/nginx/fragmentos/cabeceras.conf;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# ─── Lo que el navegador debe revisar siempre (si no, la versión nueva no llega) ───
location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
  include /etc/nginx/fragmentos/cabeceras.conf;
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}

# ─── Otros archivos (logo, íconos): una hora ───
location ~ \.[A-Za-z0-9]+$ {
  include /etc/nginx/fragmentos/cabeceras.conf;
  add_header Cache-Control "public, max-age=3600";
  try_files $uri =404;
}

# ─── Cualquier otra dirección es una pantalla de Angular (/usuarios, /roles/…) ───
location / {
  try_files $uri /index.html;
}
